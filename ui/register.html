<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CareerSense - Register</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f7f9ff;

            color: #101b4d;

            min-height: 100vh;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(65, 133, 255, 0.10),
                    transparent 30%
                ),
                #f8faff;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .register-card {

            width: 100%;

            max-width: 1050px;

            min-height: 640px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            background: white;

            border: 1px solid #dbe3f3;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 12px 35px
                rgba(27, 55, 110, 0.08);
        }


        /* =====================================================
           LEFT SIDE
        ===================================================== */

        .register-left {

            padding:
                36px 54px 40px 54px;

            display: flex;

            flex-direction: column;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            color: #101b4d;

            text-decoration: none;

            margin-bottom: 48px;

            position: relative;
        }


        .brand-icon {

            width: 32px;
            height: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #1468f5;
        }


        .brand-icon svg {

            width: 32px;
            height: 32px;
        }


        .brand-name {

            font-size: 20px;

            font-weight: 700;

            letter-spacing: -0.4px;
        }


        .brand-tagline {

            position: absolute;

            margin-top: 43px;

            margin-left: 42px;

            font-size: 10px;

            color: #30467b;

            white-space: nowrap;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .register-content {

            max-width: 430px;

            width: 100%;

            margin: 0 auto;
        }


        .register-content h1 {

            font-size: 30px;

            line-height: 1.2;

            font-weight: 700;

            color: #101b4d;

            margin-bottom: 7px;
        }


        .register-subtitle {

            font-size: 14px;

            color: #52638e;

            margin-bottom: 24px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 11px;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 17px;

            height: 17px;

            color: #6075a6;

            pointer-events: none;
        }


        .input-wrapper input {

            width: 100%;

            height: 43px;

            border:
                1px solid #ccd6ea;

            border-radius: 6px;

            background: white;

            padding:
                0 42px 0 42px;

            color: #182554;

            font-size: 13px;

            outline: none;

            transition: 0.2s ease;
        }


        .input-wrapper input::placeholder {

            color: #68799f;
        }


        .input-wrapper input:focus {

            border-color: #1672f9;

            box-shadow:
                0 0 0 3px
                rgba(22, 114, 249, 0.10);
        }


        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            color: #6075a6;

            padding: 3px;
        }


        .password-toggle svg {

            width: 17px;
            height: 17px;
        }


        /* =====================================================
           REGISTER BUTTON
        ===================================================== */

        .register-button {

            width: 100%;

            height: 44px;

            border: none;

            border-radius: 6px;

            background: #1475f5;

            color: white;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 4px;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .register-button:hover {

            background: #0d62da;

            box-shadow:
                0 5px 15px
                rgba(20, 117, 245, 0.25);

            transform:
                translateY(-1px);
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 17px 0;
        }


        .divider-line {

            flex: 1;

            height: 1px;

            background: #e1e6f1;
        }


        .divider-text {

            font-size: 11px;

            color: #7886a5;
        }


        /* =====================================================
           SOCIAL BUTTONS
        ===================================================== */

        .social-button {

            width: 100%;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            border:
                1px solid #d3dced;

            border-radius: 6px;

            background: white;

            color: #17244d;

            font-size: 12px;

            font-weight: 500;

            cursor: pointer;

            margin-bottom: 9px;

            transition: 0.2s ease;
        }


        .social-button:hover {

            background: #f8faff;

            border-color: #aebedb;
        }


        .social-icon {

            position: absolute;

            left: 16px;

            width: 17px;

            height: 17px;
        }


        .google-icon {

            font-size: 17px;

            font-weight: bold;

            color: #4285f4;
        }


        .github-icon {

            color: #111827;
        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .bottom-text {

            text-align: center;

            margin-top: 17px;

            font-size: 11px;

            color: #627298;
        }


        .bottom-text a {

            color: #1468f5;

            font-weight: 600;

            text-decoration: underline;

            margin-left: 4px;
        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .register-right {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(255,255,255,0.90),
                    rgba(225,236,255,0.95) 40%,
                    #dceaff 100%
                );
        }


        /* =====================================================
           DECORATIVE CIRCLES
        ===================================================== */

        .circle {

            position: absolute;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.35);
        }


        .circle.one {

            width: 180px;
            height: 180px;

            top: 65px;

            right: -45px;
        }


        .circle.two {

            width: 260px;
            height: 260px;

            bottom: -100px;

            left: -70px;

            background:
                rgba(196,216,255,0.38);
        }


        .circle.three {

            width: 90px;
            height: 90px;

            top: 100px;

            left: 50px;
        }


        /* =====================================================
           ILLUSTRATION
        ===================================================== */

        .illustration-area {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        /* =====================================================
           WOMAN + LAPTOP ILLUSTRATION
        ===================================================== */

        .person-scene {

            width: 300px;

            height: 330px;

            position: relative;

            margin-bottom: 4px;
        }


        /* Head */

        .head {

            position: absolute;

            width: 64px;

            height: 72px;

            left: 103px;

            top: 68px;

            background: #f2b58f;

            border-radius:
                48% 48% 45% 45%;

            z-index: 4;
        }


        /* Hair */

        .hair {

            position: absolute;

            width: 85px;

            height: 105px;

            left: 92px;

            top: 49px;

            background: #182044;

            border-radius:
                52% 48% 42% 50%;

            z-index: 3;
        }


        .hair-front {

            position: absolute;

            width: 28px;

            height: 55px;

            left: 91px;

            top: 85px;

            background: #182044;

            border-radius:
                80% 20% 60% 40%;

            z-index: 5;
        }


        /* Face */

        .eye {

            position: absolute;

            width: 5px;

            height: 5px;

            background: #182044;

            border-radius: 50%;

            top: 97px;

            z-index: 6;
        }


        .eye.left {

            left: 119px;
        }


        .eye.right {

            left: 145px;
        }


        .smile {

            position: absolute;

            width: 16px;

            height: 7px;

            border-bottom:
                2px solid #b65f5f;

            border-radius: 0 0 50% 50%;

            left: 127px;

            top: 116px;

            z-index: 6;
        }


        /* Neck */

        .neck {

            position: absolute;

            width: 23px;

            height: 26px;

            left: 123px;

            top: 130px;

            background: #f2b58f;

            z-index: 2;
        }


        /* Body */

        .body {

            position: absolute;

            width: 115px;

            height: 145px;

            left: 78px;

            top: 145px;

            background: #354f91;

            border-radius:
                45px 45px 18px 18px;

            z-index: 1;
        }


        /* Shirt */

        .shirt {

            position: absolute;

            width: 70px;

            height: 105px;

            left: 101px;

            top: 160px;

            background: #e9edf6;

            border-radius:
                35px 35px 10px 10px;

            z-index: 2;
        }


        /* Laptop */

        .laptop {

            position: absolute;

            width: 145px;

            height: 95px;

            left: 78px;

            top: 197px;

            z-index: 8;
        }


        .laptop-screen {

            width: 130px;

            height: 83px;

            margin: auto;

            background: #f6f9ff;

            border:
                7px solid #4566ad;

            border-radius:
                7px 7px 3px 3px;

            box-shadow:
                0 8px 18px
                rgba(44, 74, 139, 0.15);
        }


        .screen-inner {

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    #edf5ff,
                    #d6e7ff
                );
        }


        .laptop-base {

            width: 150px;

            height: 12px;

            margin-left: -3px;

            background: #5b76b0;

            border-radius:
                2px 2px 8px 8px;
        }


        /* =====================================================
           FEATURE CARDS
        ===================================================== */

        .feature-card {

            position: absolute;

            z-index: 10;

            min-width: 94px;

            height: 35px;

            padding:
                0 12px;

            display: flex;

            align-items: center;

            gap: 7px;

            background: white;

            border-radius: 6px;

            box-shadow:
                0 6px 18px
                rgba(47, 77, 140, 0.14);

            color: #15204d;

            font-size: 10px;

            font-weight: 600;
        }


        .feature-check {

            width: 15px;
            height: 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #4c83ef;

            color: white;

            font-size: 10px;

            font-weight: bold;
        }


        .feature-card.analyse {

            top: 35px;

            right: 5px;
        }


        .feature-card.match {

            top: 77px;

            right: -2px;
        }


        .feature-card.explore {

            top: 119px;

            right: 4px;
        }


        .feature-card.grow {

            top: 161px;

            right: 20px;
        }


        /* =====================================================
           QUOTE
        ===================================================== */

        .quote {

            max-width: 260px;

            text-align: center;

            font-size: 18px;

            line-height: 1.45;

            color: #17429a;

            font-style: italic;

            margin-top: 4px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 850px) {

            .page {

                padding: 20px;
            }


            .register-card {

                grid-template-columns: 1fr;

                max-width: 540px;
            }


            .register-right {

                display: none;
            }


            .register-left {

                padding: 30px;
            }


            .brand {

                margin-bottom: 40px;
            }
        }


        @media (max-width: 480px) {

            .page {

                padding: 10px;
            }


            .register-left {

                padding: 25px 20px;
            }


            .register-content h1 {

                font-size: 26px;
            }
        }

    </style>

</head>

<script>


    /* =====================================================
       PASSWORD VISIBILITY
    ===================================================== */

    function togglePassword(
        inputId,
        eyeId
    ) {

        const input =

    /* =====================================================
       REGISTER
    ===================================================== */

    function submitRegister() {

        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (!name) {

            alert(
                "Please enter your full name."
            );

            return;
        }


        if (!email) {

            alert(
                "Please enter your email address."
            );

            return;
        }


        if (!password) {

            alert(
                "Please enter a password."
            );

            return;
        }


        if (password.length < 6) {

            alert(
                "Password must contain at least 6 characters."
            );

            return;
        }


        if (!confirmPassword) {

            alert(
                "Please confirm your password."
            );

            return;
        }


        if (password !== confirmPassword) {

            alert(
                "Passwords do not match."
            );

            return;
        }


        /*
         * Actual account creation will be handled
         * by register.py / authentication.py.
         */

        window.parent.postMessage(

            {
                type: "register",

                name: name,

                email: email,

                password: password,

                confirmPassword:
                    confirmPassword
            },

            "*"
        );
    }


    /* =====================================================
       SOCIAL REGISTRATION
    ===================================================== */

    function socialRegister(provider) {

        alert(
            provider +
            " registration will be connected when OAuth is configured."
        );
    }
