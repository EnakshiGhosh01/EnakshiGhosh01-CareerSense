<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerSense - Login</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            display: flex;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 900px;
            max-width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .form-side {
            flex: 1.1;
            padding: 48px;
        }
        .illustration-side {
            flex: 0.9;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            border-left: 1px solid var(--border-color);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 24px;
        }
        h2 { margin: 0 0 8px 0; font-size: 24px; color: var(--text-main); }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text-main); }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .input-icon { position: absolute; left: 14px; color: var(--text-muted); font-size: 16px; }
        
        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .form-actions a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .form-actions a:hover { text-decoration: underline; }
        
        .btn-primary {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 16px;
        }
        .btn-primary:hover { background: #1d4ed8; }
        
        .divider {
            text-align: center;
            position: relative;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: var(--border-color);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        
        .btn-social {
            width: 100%;
            background: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            transition: background 0.2s;
        }
        .btn-social:hover { background: #f8fafc; }
        
        .footer-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 24px;
        }
        .footer-text a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        
        .quote {
            font-style: italic;
            color: var(--text-muted);
            font-size: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="form-side">
            <div class="brand">📊 CareerSense</div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to continue to your career journey</p>
            
            <form>
                <div class="input-group">
                    <label>Email address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" placeholder="name@example.com" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>
                
                <div class="form-actions">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" style="accent-color: var(--primary-color);"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
            </form>
            
            <div class="divider">OR</div>
            
            <button class="btn-social">🔵 Continue with Google</button>
            <button class="btn-social">⚫ Continue with GitHub</button>
            
            <div class="footer-text">
                Don't have an account? <a href="#">Register here</a>
            </div>
        </div>
        
        <div class="illustration-side">
            <div style="font-size: 64px; margin-bottom: 16px;">💼</div>
            <div class="quote">"Same you, a brighter future."</div>
        </div>
    </div>
</body>
</html>
